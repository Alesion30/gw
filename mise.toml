[tools]
go = "latest"
golangci-lint = "latest"
goreleaser = "latest"

[tasks.test]
description = "Run the tests"
run = "go test ./..."

[tasks.lint]
description = "Run lint and format checks"
run = "golangci-lint run"

[tasks.fmt]
description = "Format the code"
run = "golangci-lint fmt"

[tasks.build]
description = "Build the binary to ./gw"
run = "go build -o gw ./cmd/gw"

[tasks.snapshot]
description = "Build release artifacts into dist/ without a tag"
run = "goreleaser release --snapshot --clean"

[tasks.check]
description = "Run test and lint together"
depends = ["test", "lint"]
